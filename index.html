<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora Studio</title>
  </head>
  <body>
    <!-- 1. HEADER: Bagian atas halaman (biasanya berisi logo & navigasi) -->
    <header>
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#service">Services</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <!-- 2. MAIN: Pembungkus konten utama web (hanya ada satu <main> per halaman) -->
    <main>
      <!-- Section 1: Hero / Perkenalan Utama -->
      <section id="home">
        <h1></h1>
        <p></p>
        <button></button>
      </section>

      <!-- Section 2: Tentang Kami -->
      <section id="about">
        <h2></h2>
        <p></p>
      </section>

      <!-- Section 3: Layanan / Fitur -->
      <section id="services">
        <h2></h2>
        <p></p>
      </section>
      <!-- Section 3: section kontak -->
       <section id="Contact">
        <h2></h2>
        <p>Kirimkan pesan atau hubungi kami melalui informasi di bawah ini:</p>

        <!-- Formulir kontak sederhana -->
         <form>
            <div>
                <label for="nama">Nama:</label><br>
                <input type="text" id="nama" name="nama" placeholder="Masukan nama lengkap">
            </div>
            <div>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="Masukan email">
            </div>
            <div>
                <label for="pesan">Pesan:</label><br>
                <textarea id="pesan" placeholder="Tulis pesan anda disini"></textarea>
            </div>
            <button type="submit">Kirim</button>
         </form>
       </section>

    </main>
    <!-- 5. footer bagian paling bawah halaman biasanya berisi hak cipta -->
     <footer>
        <p><p>© 2026 Nexora Studio</p></p>
     </footer>
  </body>
</html>
